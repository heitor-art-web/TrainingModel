# Source registry and dataset split policy.
# Splits are assigned by source/video, never by individual frame.

[split]
train = 0.70
val = 0.15
test = 0.15
seed = 42
near_duplicate_hamming = 4

# v1.1.0 is intentionally a compact, curated dataset. 4000 is a hard ceiling,
# not a target. Normal video collection defaults to ~120 frames per source so
# hard cases and manually selected examples still have room in the budget.
# The v1.2.0 image budget must be decided explicitly before building that dataset.
[collection]
max_dataset_images = 4000
default_sample_fps = 1.0
default_frames_per_source = 120
max_frames_per_source = 200

[[sources]]
id = "OwiQgAMqyUs"
kind = "youtube"
reference = "https://www.youtube.com/watch?v=OwiQgAMqyUs"
description = "First ~60 seconds reserved as the initial gold-test source."
role = "gold_test"
start_seconds = 0.0
end_seconds = 60.0
allow_training = false
allow_hard_case_training = false

# Basketball Game Detections (FirstTime / Roboflow Universe), CC BY 4.0.
# Until original game/video identities are proven, all selected frames are kept
# in one training-only pool so they cannot leak into validation or test.
[[sources]]
id = "bgd_training_pool"
kind = "external_dataset"
reference = "https://universe.roboflow.com/firsttime/basketball-game-detections"
description = "Curated Basketball Game Detections images with unknown original game grouping."
role = "train"
allow_training = true
allow_hard_case_training = true
