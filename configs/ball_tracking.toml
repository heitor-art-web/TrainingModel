# Temporal ball tracking defaults.
# These values affect post-processing only; they do not retrain the detector.

confidence = 0.25
iou = 0.70
imgsz = 768
max_gap_frames = 6
max_distance_ratio = 0.12
position_alpha = 0.65
velocity_beta = 0.25
size_alpha = 0.50
trail_length = 20

# Hard-case extraction defaults.
hard_case_confidence = 0.35
hard_case_jump_ratio = 0.08
hard_case_min_gap_frames = 15
hard_case_max_per_reason = 100
